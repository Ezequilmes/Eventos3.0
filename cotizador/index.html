<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestador - Eventos Tres.Cero</title>
    <!-- Bibliotecas base -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; }
        @media print {
            .print-hidden { display: none !important; }
            #presupuesto-doc { width: 100% !important; max-width: none !important; margin: 0 !important; border: none !important; box-shadow: none !important; }
            body { background: white; }
            @page { margin: 0.5cm; size: auto; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Iconos SVG Integrados
        const Icons = {
            Printer: ({size=18, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            ),
            FileText: ({size=24, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            ),
            Info: ({size=18, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            ),
            CreditCard: ({size=20, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            ),
            WhatsApp: ({size=20, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-1.157 4.228 4.228-1.157z"/></svg>
            ),
            Copy: ({size=16, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            ),
            Check: ({size=16, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
            ),
            MapPin: ({size=18, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            ),
            Calendar: ({size=18, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            )
        };

        const App = () => {
            const [data, setData] = useState({
                fecha: '',
                personas: 0,
                cliente: '',
                telefono: '',
                direccion: '',
                entreCalles: '',
                localidad: '',
                servicios: [
                    { id: 1, nombre: 'Pizza Party Premium', precio: 0, activo: false, descripcion: 'Bruschettas, Empanadas y 10 variedades de pizza libre.' },
                    { id: 2, nombre: 'Tacos Party & Show', precio: 0, activo: false, descripcion: 'Bruschettas, Pernil de entrada y Show de tacos libres.' },
                    { id: 3, nombre: 'Servicio Pre-Armado', precio: 0, activo: false, descripcion: 'Menú listo para servir, sin personal en el lugar.' },
                ],
                personal: [
                    { id: 20, nombre: 'Cocinera', precio: 0, cantidad: 0 },
                    { id: 21, nombre: 'Mozos', precio: 0, cantidad: 0 },
                ],
                adicionales: [
                    { id: 10, nombre: 'Canilla Libre Gaseosas', precio: 0, cantidad: 0, activo: false, desc: 'Línea Coca-Cola, aguas y jugos.' },
                    { id: 11, nombre: 'Barra de Tragos PROMO', precio: 0, cantidad: 0, activo: false, desc: '3hs de servicio. Incluye Bartender y coctelería clásica.' },
                    { id: 13, nombre: 'Tabla de Fiambres Clásica', precio: 68000, cantidad: 1, activo: false, desc: 'Servicio premium cada 10 personas.' },
                    { id: 14, nombre: 'Pernil CHICO (50 Figazas)', precio: 58500, cantidad: 1, activo: false, desc: 'Incluye 3 salsas artesanales.' },
                    { id: 15, nombre: 'Pernil MEDIANO (100 Figazas)', precio: 69700, cantidad: 1, activo: false, desc: 'Incluye 3 salsas artesanales.' },
                    { id: 16, nombre: 'Pernil GRANDE (150 Figazas)', precio: 120000, cantidad: 1, activo: false, desc: 'Incluye 3 salsas artesanales.' },
                ],
                distanciaKm: 0,
                costoPorKm: 2500,
                recargoTarjetaPorcentaje: 8, // 8% de recargo por Seña en Mercado Pago
                descuentoContadoPorcentaje: 5,
            });

            const [calculos, setCalculos] = useState({
                subtotal: 0,
                logistica: 0,
                totalBaseTransferencia: 0,
                sena50Transferencia: 0,
                sena50MercadoPago: 0,
                total100TransferenciaPromo: 0,
                total100MercadoPago: 0
            });

            const [tabMetodoPago, setTabMetodoPago] = useState('transferencia'); // 'transferencia' o 'mercadopago'
            const [cargandoMP, setCargandoMP] = useState(false);
            const [mensajePago, setMensajePago] = useState('');
            const [copiadoAlias, setCopiadoAlias] = useState(false);
            const [copiadoCvu, setCopiadoCvu] = useState(false);
            const [pagoExitoso, setPagoExitoso] = useState(false);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const pagoParam = params.get('pago');
                const collectionStatus = params.get('collection_status');
                const statusParam = params.get('status');

                if (pagoParam === 'exito' && (collectionStatus === 'approved' || statusParam === 'approved')) {
                    setPagoExitoso(true);
                } else if (pagoParam === 'error' || collectionStatus === 'rejected' || statusParam === 'rejected') {
                    setMensajePago('El pago no pudo completarse o fue cancelado.');
                }
            }, []);

            const aplicaBonificacionCocinera = data.personas > 30;

            useEffect(() => {
                let subtotalMenu = data.servicios
                    .filter(s => s.activo)
                    .reduce((acc, s) => acc + (s.precio * data.personas), 0);

                let subtotalPersonal = data.personal.reduce((acc, p) => {
                    if (p.id === 20 && aplicaBonificacionCocinera) return acc;
                    return acc + (p.precio * p.cantidad);
                }, 0);

                let subtotalAdicionales = data.adicionales
                    .filter(a => a.activo)
                    .reduce((acc, a) => acc + (a.precio * (a.cantidad || 0)), 0);

                const subtotalGeneral = subtotalMenu + subtotalPersonal + subtotalAdicionales;
                const costoLogistica = Number(data.distanciaKm) * Number(data.costoPorKm);
                const totalBase = subtotalGeneral + costoLogistica; // Precio de lista original sin recargo (Transferencia/Efectivo)

                // 1. Seña 50%
                const sena50Transf = totalBase * 0.50;
                // 8% de recargo al señar con Mercado Pago / Link de pago
                const recargoMult8 = 1 + (Number(data.recargoTarjetaPorcentaje) / 100);
                const sena50MP = sena50Transf * recargoMult8;

                // 2. Pago Total 100%
                const descContadoMult = 1 - (Number(data.descuentoContadoPorcentaje) / 100);
                const total100Transf = totalBase * descContadoMult;
                const total100MP = totalBase * recargoMult8;

                setCalculos({
                    subtotal: subtotalGeneral,
                    logistica: costoLogistica,
                    totalBaseTransferencia: totalBase,
                    sena50Transferencia: sena50Transf,
                    sena50MercadoPago: sena50MP,
                    total100TransferenciaPromo: total100Transf,
                    total100MercadoPago: total100MP
                });
            }, [data, aplicaBonificacionCocinera]);

            const updateItem = (category, id, field, value) => {
                const newData = { ...data };
                newData[category] = newData[category].map(item =>
                    item.id === id ? { ...item, [field]: value } : item
                );
                setData(newData);
            };

            const copiarTexto = (texto, tipo) => {
                navigator.clipboard.writeText(texto);
                if (tipo === 'alias') {
                    setCopiadoAlias(true);
                    setTimeout(() => setCopiadoAlias(false), 2500);
                } else {
                    setCopiadoCvu(true);
                    setTimeout(() => setCopiadoCvu(false), 2500);
                }
            };

            const procesarPagoMercadoPago = async (tipoPago) => {
                setCargandoMP(true);
                setMensajePago('');
                try {
                    const monto = tipoPago === 'sena_50' ? calculos.sena50MercadoPago : calculos.total100MercadoPago;
                    const conceptoServicios = data.servicios.filter(s => s.activo).map(s => s.nombre).join(', ') || 'Servicio Catering';

                    const res = await fetch('https://huhigdlbztpqwtfyznya.supabase.co/functions/v1/crear-preferencia-mp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            cliente_nombre: data.cliente || 'Cliente Cotizador',
                            cliente_telefono: data.telefono || '',
                            monto: monto,
                            concepto: conceptoServicios,
                            tipo_pago: tipoPago,
                            reserva_id: `RES-${Date.now()}`,
                            success_url: window.location.href.split('?')[0] + '?pago=exito'
                        })
                    });

                    const resData = await res.json();
                    if (resData.init_point) {
                        window.location.href = resData.init_point;
                    } else {
                        setMensajePago('Error en Mercado Pago: ' + (resData.detail || 'No se pudo generar preferencia'));
                    }
                } catch (e) {
                    setMensajePago('Error de conexión al procesar el pago.');
                } finally {
                    setCargandoMP(false);
                }
            };

            const generarWhatsAppUrl = (medioPago) => {
                const clienteStr = data.cliente || 'Cliente';
                const telStr = data.telefono || 'Sin especificar';
                const fechaStr = data.fecha || 'A confirmar';
                const direccionStr = data.direccion || 'Pendiente de definir';
                const entreCallesStr = data.entreCalles || 'Sin especificar';
                const localidadStr = data.localidad || 'Sin especificar';

                const menuActivos = data.servicios.filter(s => s.activo).map(s => `${s.nombre}`).join(', ');
                const adicionalesActivos = data.adicionales.filter(a => a.activo && a.cantidad > 0).map(a => `${a.nombre} (x${a.cantidad})`).join(', ');

                let detalleServicios = menuActivos;
                if (adicionalesActivos) {
                    detalleServicios += (detalleServicios ? ' + ' : '') + adicionalesActivos;
                }
                if (!detalleServicios) {
                    detalleServicios = 'Combo Pernil / Servicio Eventos Tres.Cero';
                }

                const montoTotal = calculos.totalBaseTransferencia;
                const esMP = medioPago === 'mercadopago';
                const montoSena = esMP ? Math.round(calculos.sena50MercadoPago) : calculos.sena50Transferencia;
                const recargoTexto = esMP ? ' (Incluye 8% recargo Link de Pago)' : ' (Sin recargo)';

                const texto = `Hola *Eventos Tres.Cero*! 👋🏼\n` +
                    `Quiero confirmar la reserva / pedido para mi evento.\n\n` +
                    `📋 *DETALLE DEL PEDIDO*:\n` +
                    `• *Cliente*: ${clienteStr}\n` +
                    `• *Teléfono*: ${telStr}\n` +
                    `• *Servicio/Combo*: ${detalleServicios}\n` +
                    `• *Invitados*: ${data.personas} personas\n` +
                    `• *Fecha del Evento*: ${fechaStr}\n\n` +
                    `📍 *UBICACIÓN Y ENTREGA*:\n` +
                    `• *Dirección*: ${direccionStr}\n` +
                    `• *Entre calles*: ${entreCallesStr}\n` +
                    `• *Localidad*: ${localidadStr}\n\n` +
                    `💰 *RESUMEN DE SEÑA / PAGO*:\n` +
                    `• *Inversión Total*: $${montoTotal.toLocaleString()}\n` +
                    `• *Medio de Pago*: ${esMP ? 'Mercado Pago (Link / Tarjetas)' : 'Transferencia Bancaria'}\n` +
                    `• *Monto Seña 50%*: $${montoSena.toLocaleString()}${recargoTexto}\n` +
                    `• *Saldo el día del evento*: $${calculos.sena50Transferencia.toLocaleString()}\n\n` +
                    `Adjunto comprobante o quedo a la espera de la confirmación. ¡Muchas gracias!`;

                return `https://wa.me/5491132664036?text=${encodeURIComponent(texto)}`;
            };

            return (
                <div className="min-h-screen p-3 md:p-8">
                    {pagoExitoso && (
                        <div className="max-w-6xl mx-auto bg-green-600 text-white rounded-3xl p-6 sm:p-8 mb-8 shadow-2xl border-4 border-green-400 text-center">
                            <h3 className="text-2xl sm:text-3xl font-black uppercase italic mb-2">¡Pago Aprobado con Éxito! 🎉</h3>
                            <p className="text-sm font-bold opacity-90 max-w-3xl mx-auto">
                                Tu seña ha sido procesada correctamente a través de Mercado Pago. Completá los datos de tu evento abajo (dirección, fecha y entrega) y hacé clic en el botón de WhatsApp para enviarnos el comprobante y agendar tu servicio oficialmente.
                            </p>
                        </div>
                    )}
                    {/* PANEL DE EDICIÓN Y COTIZACIÓN */}
                    <div className="max-w-6xl mx-auto bg-white rounded-2xl sm:rounded-3xl shadow-xl p-4 sm:p-8 mb-8 print-hidden border-t-8 border-red-600">
                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
                            <h2 className="text-xl sm:text-2xl font-black text-slate-800 flex items-center gap-2 uppercase italic tracking-tighter">
                                <Icons.FileText size={24} className="text-red-600" /> Cotizador Eventos 3.0
                            </h2>
                            <button onClick={() => window.print()} className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-black transition text-sm">
                                <Icons.Printer size={18} /> Imprimir PDF
                            </button>
                        </div>

                        {/* DATOS DEL CLIENTE Y FECHA */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div>
                                <label className="text-xs font-black uppercase text-slate-400">Cliente</label>
                                <input type="text" className="w-full p-3 border-2 rounded-xl mt-1 font-bold focus:border-red-500 outline-none bg-slate-50 text-sm" value={data.cliente} onChange={e => setData({...data, cliente: e.target.value})} placeholder="Nombre completo" />
                            </div>
                            <div>
                                <label className="text-xs font-black uppercase text-slate-400">WhatsApp / Teléfono</label>
                                <input type="text" className="w-full p-3 border-2 rounded-xl mt-1 text-center font-bold focus:border-red-500 outline-none bg-slate-50 text-sm" value={data.telefono} onChange={e => setData({...data, telefono: e.target.value})} placeholder="11 3266-4036" />
                            </div>
                            <div>
                                <label className="text-xs font-black uppercase text-slate-400">Invitados</label>
                                <input type="number" className="w-full p-3 border-2 rounded-xl mt-1 text-center font-black focus:border-red-500 outline-none bg-slate-50 text-sm" value={data.personas} onChange={e => setData({...data, personas: Number(e.target.value)})} placeholder="Pers." />
                            </div>
                            <div>
                                <label className="text-xs font-black uppercase text-slate-400">Fecha del Evento</label>
                                <input type="date" className="w-full p-3 border-2 rounded-xl mt-1 focus:border-red-500 outline-none bg-slate-50 text-xs font-bold" value={data.fecha} onChange={e => setData({...data, fecha: e.target.value})} />
                            </div>
                        </div>

                        {/* FORMULARIO DE DOMICILIO DE ENTREGA */}
                        <div className="bg-slate-50 p-4 sm:p-6 rounded-2xl border-2 border-slate-200 mb-8">
                            <h3 className="text-xs font-black uppercase tracking-wider text-slate-600 mb-3 flex items-center gap-2">
                                <Icons.MapPin size={16} className="text-red-600" /> Dirección de Entrega / Evento
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label className="text-[10px] font-black uppercase text-slate-400">Dirección Exacta</label>
                                    <input type="text" className="w-full p-2.5 border rounded-xl mt-1 font-bold text-xs outline-none focus:border-red-500 bg-white" value={data.direccion} onChange={e => setData({...data, direccion: e.target.value})} placeholder="Ej: Av. Corrientes 1234" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase text-slate-400">Entre Calles</label>
                                    <input type="text" className="w-full p-2.5 border rounded-xl mt-1 font-bold text-xs outline-none focus:border-red-500 bg-white" value={data.entreCalles} onChange={e => setData({...data, entreCalles: e.target.value})} placeholder="Ej: Libertad y Talcahuano" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase text-slate-400">Localidad</label>
                                    <input type="text" className="w-full p-2.5 border rounded-xl mt-1 font-bold text-xs outline-none focus:border-red-500 bg-white" value={data.localidad} onChange={e => setData({...data, localidad: e.target.value})} placeholder="Ej: CABA / Lanús" />
                                </div>
                            </div>
                        </div>

                        {/* MENÚ Y EXTRAS */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="space-y-6">
                                <section className="p-4 border-l-4 border-red-600 bg-red-50/20 rounded-r-2xl">
                                    <h3 className="font-black text-slate-700 mb-4 uppercase text-xs">Menú Principal / Combos</h3>
                                    {data.servicios.map((s) => (
                                        <div key={s.id} className="flex items-center gap-3 mb-3 bg-white p-2.5 rounded-xl border border-slate-100">
                                            <input type="checkbox" checked={s.activo} onChange={e => updateItem('servicios', s.id, 'activo', e.target.checked)} className="w-5 h-5 accent-red-600" />
                                            <div className="flex-1">
                                                <span className="text-xs sm:text-sm font-bold block">{s.nombre}</span>
                                                <span className="text-[10px] text-slate-400 block">{s.descripcion}</span>
                                            </div>
                                            <input type="number" className="w-20 p-1 border rounded text-right text-xs font-bold" value={s.precio} onChange={e => updateItem('servicios', s.id, 'precio', Number(e.target.value))} />
                                        </div>
                                    ))}
                                </section>

                                <section className="p-4 border-l-4 border-slate-700 bg-slate-50 rounded-r-2xl">
                                    <h3 className="font-black text-slate-700 mb-4 uppercase text-xs flex justify-between">
                                        Personal {aplicaBonificacionCocinera && <span className="text-green-600 font-black">¡Bonificado!</span>}
                                    </h3>
                                    {data.personal.map(p => (
                                        <div key={p.id} className="flex items-center gap-3 mb-2">
                                            <span className="flex-1 text-xs font-bold uppercase text-slate-600">{p.nombre}</span>
                                            <input type="number" className="w-12 p-1 border rounded text-center text-xs" value={p.cantidad} onChange={e => updateItem('personal', p.id, 'cantidad', Number(e.target.value))} />
                                            <input type="number" disabled={p.id === 20 && aplicaBonificacionCocinera} className="w-20 p-1 border rounded text-right text-xs font-bold" value={p.precio} onChange={e => updateItem('personal', p.id, 'precio', Number(e.target.value))} />
                                        </div>
                                    ))}
                                </section>
                            </div>

                            <div className="space-y-6">
                                <section className="p-4 border-l-4 border-blue-600 bg-blue-50/20 rounded-r-2xl">
                                    <h3 className="font-black text-slate-700 mb-3 uppercase text-xs">Perniles & Adicionales</h3>
                                    <div className="grid grid-cols-2 gap-2 mb-3">
                                        <div>
                                            <label className="text-[9px] font-black text-slate-400 uppercase">DISTANCIA KM</label>
                                            <input type="number" className="w-full p-2 border rounded-xl font-bold text-xs bg-white" value={data.distanciaKm} onChange={e => setData({...data, distanciaKm: Number(e.target.value)})} />
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-black text-slate-400 uppercase">RECARGO LINK MP (%)</label>
                                            <input type="number" className="w-full p-2 border rounded-xl font-bold text-xs text-blue-700 bg-white" value={data.recargoTarjetaPorcentaje} onChange={e => setData({...data, recargoTarjetaPorcentaje: Number(e.target.value)})} />
                                        </div>
                                    </div>
                                    <div className="max-h-48 overflow-y-auto space-y-2 pr-1">
                                        {data.adicionales.map(a => (
