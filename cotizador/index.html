<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestador - Eventos Tres.Cero</title>
    <!-- Bibliotecas base -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; }
        @media print {
            .print-hidden { display: none !important; }
            #presupuesto-doc { width: 100% !important; max-width: none !important; margin: 0 !important; border: none !important; box-shadow: none !important; }
            body { background: white; }
            @page { margin: 0.5cm; size: auto; }
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Iconos SVG Integrados para máxima compatibilidad
        const Icons = {
            Printer: ({size=18, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            ),
            FileText: ({size=24, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            ),
            Clock: ({size=14, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ),
            Info: ({size=18, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            ),
            Gift: ({size=14, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
            ),
            MapPin: ({size=12, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            ),
            Plus: ({size=14, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            ),
            Zap: ({size=24, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" className={className}><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline></svg>
            ),
            Percent: ({size=12, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="6.5" cy="6.5" r="2.5"></circle><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>
            ),
            CheckCircle: ({size=20, className=""}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            )
        };

        const App = () => {
            const [data, setData] = useState({
                fecha: '',
                personas: 0,
                horarioInicio: '',
                horarioFin: '',
                cliente: '',
                servicios: [
                    { id: 1, nombre: 'Pizza Party Premium', precio: 0, activo: false, descripcion: 'Bruschettas, Empanadas y 10 variedades de pizza libre.' },
                    { id: 2, nombre: 'Tacos Party & Show', precio: 0, activo: false, descripcion: 'Bruschettas, Pernil de entrada y Show de tacos libres.' },
                    { id: 3, nombre: 'Servicio Pre-Armado', precio: 0, activo: false, descripcion: 'Menú listo para servir, sin personal en el lugar.' },
                ],
                personal: [
                    { id: 20, nombre: 'Cocinera', precio: 0, cantidad: 0 },
                    { id: 21, nombre: 'Mozos', precio: 0, cantidad: 0 },
                ],
                adicionales: [
                    { id: 10, nombre: 'Canilla Libre Gaseosas', precio: 0, cantidad: 0, activo: false, desc: 'Línea Coca-Cola, aguas y jugos.' },
                    { id: 11, nombre: 'Barra de Tragos PROMO', precio: 0, cantidad: 0, activo: false, desc: '3hs de servicio. Incluye Bartender y coctelería clásica.' },
                    { id: 13, nombre: 'Tabla de Fiambres Clásica', precio: 68000, cantidad: 1, activo: false, desc: 'Servicio premium cada 10 personas.' },
                    { id: 14, nombre: 'Pernil CHICO (50 Figazas)', precio: 58500, cantidad: 1, activo: false, desc: 'Incluye 3 salsas artesanales.' },
                    { id: 15, nombre: 'Pernil MEDIANO (100 Figazas)', precio: 69700, cantidad: 1, activo: false, desc: 'Incluye 3 salsas artesanales.' },
                    { id: 16, nombre: 'Pernil GRANDE (150 Figazas)', precio: 120000, cantidad: 1, activo: false, desc: 'Incluye 3 salsas artesanales.' },
                ],
                distanciaKm: 0,
                costoPorKm: 2500,
                financiacionPorcentaje: 0,
                esPagoTotal: false,
            });

            const [calculos, setCalculos] = useState({
                subtotal: 0,
                logistica: 0,
                montoFinanciacion: 0,
                totalFinal: 0,
                precioPromo: 0
            });

            const aplicaBonificacionCocinera = data.personas > 30;

            useEffect(() => {
                let subtotalMenu = data.servicios
                    .filter(s => s.activo)
                    .reduce((acc, s) => acc + (s.precio * data.personas), 0);

                let subtotalPersonal = data.personal.reduce((acc, p) => {
                    if (p.id === 20 && aplicaBonificacionCocinera) return acc;
                    return acc + (p.precio * p.cantidad);
                }, 0);

                let subtotalAdicionales = data.adicionales
                    .filter(a => a.activo)
                    .reduce((acc, a) => acc + (a.precio * (a.cantidad || 0)), 0);

                const subtotalGeneral = subtotalMenu + subtotalPersonal + subtotalAdicionales;
                const costoLogistica = Number(data.distanciaKm) * Number(data.costoPorKm);
                const baseParaFinanciar = subtotalGeneral + costoLogistica;
                const montoFinan = baseParaFinanciar * (Number(data.financiacionPorcentaje) / 100);

                setCalculos({
                    subtotal: subtotalGeneral,
                    logistica: costoLogistica,
                    montoFinanciacion: montoFinan,
                    totalFinal: data.esPagoTotal ? baseParaFinanciar : baseParaFinanciar + montoFinan,
                    precioPromo: baseParaFinanciar
                });
            }, [data, aplicaBonificacionCocinera]);

            const updateItem = (category, id, field, value) => {
                const newData = { ...data };
                newData[category] = newData[category].map(item =>
                    item.id === id ? { ...item, [field]: value } : item
                );
                setData(newData);
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    {/* PANEL DE EDICIÓN */}
                    <div className="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-6 mb-8 print-hidden border-t-8 border-red-600">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black text-slate-800 flex items-center gap-2 uppercase italic tracking-tighter">
                                <Icons.FileText size={24} className="text-red-600" /> Panel Cotización
                            </h2>
                            <div className="flex gap-2">
                                <button onClick={() => window.print()} className="bg-slate-900 text-white px-6 py-2 rounded-xl font-bold flex items-center gap-2 hover:bg-black transition">
                                    <Icons.Printer size={18} /> Imprimir PDF
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <div className="md:col-span-2">
                                <label className="text-xs font-black uppercase text-slate-400">Cliente</label>
                                <input type="text" className="w-full p-3 border-2 rounded-xl mt-1 font-bold focus:border-red-500 outline-none bg-slate-50" value={data.cliente} onChange={e => setData({...data, cliente: e.target.value})} />
                            </div>
                            <div>
                                <label className="text-xs font-black uppercase text-slate-400">Invitados</label>
                                <input type="number" className="w-full p-3 border-2 rounded-xl mt-1 text-center font-black focus:border-red-500 outline-none bg-slate-50" value={data.personas} onChange={e => setData({...data, personas: Number(e.target.value)})} />
                            </div>
                            <div>
                                <label className="text-xs font-black uppercase text-slate-400">Fecha</label>
                                <input type="date" className="w-full p-3 border-2 rounded-xl mt-1 focus:border-red-500 outline-none bg-slate-50" value={data.fecha} onChange={e => setData({...data, fecha: e.target.value})} />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <section className="p-4 border-l-4 border-red-600 bg-red-50/20">
                                    <h3 className="font-black text-slate-700 mb-4 uppercase text-xs">Menú Principal</h3>
                                    {data.servicios.map((s, idx) => (
                                        <div key={s.id} className="flex items-center gap-3 mb-3">
                                            <input type="checkbox" checked={s.activo} onChange={e => updateItem('servicios', s.id, 'activo', e.target.checked)} className="w-5 h-5 accent-red-600" />
                                            <span className="flex-1 text-sm font-bold">{s.nombre}</span>
                                            <input type="number" className="w-24 p-1 border rounded text-right text-sm" value={s.precio} onChange={e => updateItem('servicios', s.id, 'precio', Number(e.target.value))} />
                                        </div>
                                    ))}
                                </section>

                                <section className="p-4 border-l-4 border-slate-700 bg-slate-50">
                                    <h3 className="font-black text-slate-700 mb-4 uppercase text-xs flex justify-between">
                                        Personal {aplicaBonificacionCocinera && <span className="text-green-600 font-black">¡Bonificación!</span>}
                                    </h3>
                                    {data.personal.map(p => (
                                        <div key={p.id} className="flex items-center gap-4 mb-2">
                                            <span className="flex-1 text-xs font-bold uppercase text-slate-500">{p.nombre}</span>
                                            <input type="number" className="w-14 p-1 border rounded text-center text-sm" value={p.cantidad} onChange={e => updateItem('personal', p.id, 'cantidad', Number(e.target.value))} />
                                            <input type="number" disabled={p.id === 20 && aplicaBonificacionCocinera} className="w-24 p-1 border rounded text-right text-sm" value={p.precio} onChange={e => updateItem('personal', p.id, 'precio', Number(e.target.value))} />
                                        </div>
                                    ))}
                                </section>
                            </div>

                            <div className="space-y-6">
                                <section className="p-4 border-l-4 border-blue-600 bg-blue-50/20">
                                    <h3 className="font-black text-slate-700 mb-4 uppercase text-xs">Extras & Logística</h3>
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400">DISTANCIA KM</label>
                                            <input type="number" className="w-full p-2 border rounded font-bold" value={data.distanciaKm} onChange={e => setData({...data, distanciaKm: Number(e.target.value)})} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400">FINANCIACIÓN %</label>
                                            <input type="number" className="w-full p-2 border rounded font-bold text-blue-700" value={data.financiacionPorcentaje} onChange={e => setData({...data, financiacionPorcentaje: Number(e.target.value)})} />
                                        </div>
                                    </div>
                                    <div className="max-h-40 overflow-y-auto space-y-2 pr-2">
                                        {data.adicionales.map(a => (
                                            <div key={a.id} className="flex items-center gap-2 bg-white p-2 rounded border border-slate-100">
                                                <input type="checkbox" checked={a.activo} onChange={e => updateItem('adicionales', a.id, 'activo', e.target.checked)} className="accent-red-600" />
                                                <span className="flex-1 text-[10px] font-black uppercase">{a.nombre}</span>
                                                <input type="number" className="w-12 p-1 border text-xs text-center" value={a.cantidad} onChange={e => updateItem('adicionales', a.id, 'cantidad', Number(e.target.value))} />
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <div className={`p-6 rounded-2xl border-2 text-center transition ${data.esPagoTotal ? 'bg-green-100 border-green-500' : 'bg-red-50 border-red-500'}`}>
                                    <button onClick={() => setData({...data, esPagoTotal: !data.esPagoTotal})} className={`mb-4 px-6 py-2 rounded-full font-black text-[10px] uppercase shadow-md ${data.esPagoTotal ? 'bg-green-600 text-white' : 'bg-red-600 text-white'}`}>
                                        {data.esPagoTotal ? 'PRECIO PROMO ACTIVO' : 'MODO SEÑA 50%'}
                                    </button>
                                    <p className="text-4xl font-black text-slate-800">${calculos.totalFinal.toLocaleString()}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* DOCUMENTO PDF */}
                    <div id="presupuesto-doc" className="max-w-4xl mx-auto bg-white shadow-2xl overflow-hidden border border-slate-100 mb-20">
                        <div className="relative h-48 bg-gradient-to-r from-red-800 to-red-600 flex items-center px-12 overflow-hidden">
                            <div className="flex items-center gap-10 z-10 w-full text-white">
                                <div className="bg-white p-6 rounded-3xl shadow-2xl transform -rotate-3 border-4 border-red-500">
                                    <div className="w-24 h-24 flex flex-col items-center justify-center font-black text-red-600 text-5xl leading-tight text-center italic">
                                        <span>E</span>
                                        <span className="text-2xl border-t-4 border-red-100 mt-1 pt-1">3.0</span>
                                    </div>
                                </div>
                                <div className="text-white border-l-4 border-red-400 pl-10">
                                    <h1 className="text-6xl font-black tracking-tighter uppercase italic text-white drop-shadow-2xl leading-none italic font-black italic drop-shadow-2xl">Eventos Tres.Cero</h1>
                                    <p className="text-2xl font-light tracking-[0.2em] uppercase opacity-90 mt-2">Catering • Premium • Experiences</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-16 text-slate-800 relative">
                            <div className="flex justify-between items-start mb-16 border-b-4 border-slate-50 pb-10">
                                <div className="space-y-4">
                                    <h3 className="text-4xl font-black text-slate-900 uppercase italic tracking-tighter">{data.cliente || 'Nombre del Cliente'}</h3>
                                    <div className="flex gap-10 text-[11px] font-black uppercase text-slate-500">
                                        <p>Fecha: <span className="text-slate-900">{data.fecha || 'A confirmar'}</span></p>
                                        <p>Invitados: <span className="text-red-600">{data.personas} PERS.</span></p>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-12">
                                <div className="bg-white rounded-[2rem] overflow-hidden border-2 border-slate-50 shadow-sm">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="bg-slate-50 text-[10px] font-black text-slate-400 border-b border-slate-100 uppercase italic">
                                                <th className="px-8 py-5">Concepto</th>
                                                <th className="px-8 py-5 text-center">Referencia</th>
                                                <th className="px-8 py-5 text-right">Subtotal</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {data.servicios.filter(s => s.activo).map(s => (
                                                <tr key={s.id}>
                                                    <td className="px-8 py-6 font-black uppercase italic">{s.nombre}</td>
                                                    <td className="px-8 py-6 text-center text-xs font-black text-slate-400 tracking-tighter">${s.precio.toLocaleString()} x pers.</td>
                                                    <td className="px-8 py-6 text-right font-black text-slate-900 text-lg italic tracking-tighter">${(s.precio * data.personas).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                            {data.personal.filter(p => p.cantidad > 0).map(p => (
                                                <tr key={p.id}>
                                                    <td className="px-8 py-5 font-black uppercase text-xs">{p.nombre} {p.id === 20 && aplicaBonificacionCocinera && <span className="text-green-600 ml-2">BONIFICADO</span>}</td>
                                                    <td className="px-8 py-5 text-center text-xs font-bold text-slate-400 tracking-tighter">{p.cantidad} pers.</td>
                                                    <td className="px-8 py-5 text-right font-black text-slate-900 italic tracking-tighter">{ (p.id === 20 && aplicaBonificacionCocinera) ? 'SIN CARGO' : `$${(p.precio * p.cantidad).toLocaleString()}`}</td>
                                                </tr>
                                            ))}
                                            {data.adicionales.filter(a => a.activo).map(a => (
                                                <tr key={a.id}>
                                                    <td className="px-8 py-5 font-black uppercase text-xs">{a.nombre}</td>
                                                    <td className="px-8 py-5 text-center text-xs font-black text-slate-400 tracking-tighter">{a.cantidad} u.</td>
                                                    <td className="px-8 py-5 text-right font-black text-slate-900 italic tracking-tighter">${(a.precio * a.cantidad).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                            {calculos.logistica > 0 && (
                                                <tr>
                                                    <td className="px-8 py-5 font-black uppercase text-xs italic tracking-tighter">Logística / Traslado</td>
                                                    <td className="px-8 py-5 text-center text-[10px] font-bold text-slate-400 tracking-tighter">{data.distanciaKm} KM</td>
                                                    <td className="px-8 py-5 text-right font-black text-slate-900 italic tracking-tighter">${calculos.logistica.toLocaleString()}</td>
                                                </tr>
                                            )}
                                            {!data.esPagoTotal && calculos.montoFinanciacion > 0 && (
                                                <tr className="bg-blue-50/50">
                                                    <td className="px-8 py-5 font-black text-blue-800 uppercase text-xs italic tracking-tighter">Gastos de Financiación</td>
                                                    <td className="px-8 py-5 text-center text-[10px] font-black text-blue-400 italic tracking-tighter">{data.financiacionPorcentaje}%</td>
                                                    <td className="px-8 py-5 text-right font-black text-blue-800 italic tracking-tighter">${calculos.montoFinanciacion.toLocaleString()}</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex flex-col items-end pt-4 space-y-6">
                                    <div className="w-96 space-y-4">
                                        <div className="bg-slate-900 p-8 rounded-[3rem] shadow-2xl text-white">
                                            <p className="text-[10px] font-black uppercase tracking-[0.4em] opacity-40 mb-2">Inversión Final</p>
                                            <div className="flex justify-between items-baseline">
                                                <span className="text-4xl font-black italic tracking-tighter uppercase leading-none">Total:</span>
                                                <span className="text-5xl font-black italic tracking-tighter text-red-500 leading-none">${calculos.totalFinal.toLocaleString()}</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-white p-4 rounded-[2rem] border-2 border-slate-50 text-center">
                                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-tight">Seña 50%</p>
                                                <p className="text-2xl font-black text-slate-900 italic tracking-tighter mt-1">${(calculos.totalFinal / 2).toLocaleString()}</p>
                                            </div>
                                            <div className="bg-white p-4 rounded-[2rem] border-2 border-slate-50 text-center">
                                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-tight">Saldo Evento</p>
                                                <p className="text-2xl font-black text-slate-900 italic tracking-tighter mt-1">${(calculos.totalFinal / 2).toLocaleString()}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {!data.esPagoTotal && data.financiacionPorcentaje > 0 && (
                                        <div className="w-96 bg-green-50 border-4 border-green-500 rounded-[2.5rem] p-6 shadow-xl transform rotate-1">
                                            <div className="flex items-center gap-3 text-green-700 mb-2">
                                                <Icons.Zap size={24} className="fill-green-600 text-green-600" />
                                                <h5 className="font-black uppercase tracking-widest text-sm italic leading-none">¡Opción Pago Promocional!</h5>
                                            </div>
                                            <p className="text-[10px] text-green-600 font-bold uppercase mb-4 leading-tight italic font-black">
                                                Abonando el 100% eliminas el costo de financiación.
                                            </p>
                                            <div className="flex justify-between items-end border-t border-green-200 pt-4">
                                                <div>
                                                    <p className="text-[9px] font-black text-green-500 uppercase italic">Precio Promo</p>
                                                    <p className="text-3xl font-black text-green-700 italic">${calculos.precioPromo.toLocaleString()}</p>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-bold text-green-600">Ahorras: ${calculos.montoFinanciacion.toLocaleString()}</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <section className="bg-slate-50 p-12 rounded-[3.5rem] mt-16 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-red-600 opacity-[0.03] rounded-full -mr-32 -mt-32"></div>
